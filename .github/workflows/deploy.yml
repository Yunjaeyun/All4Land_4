# main에 push되면 이미지 빌드(GHCR) → VM 배포 순서로 진행한다.
# 따로 테스트 단계는 두지 않는다. 컴파일이 깨지면 이미지 빌드에서 실패한다.
# VM(e2-micro)은 RAM이 1GB라 이미지를 직접 빌드하지 않고 받아서 실행만 한다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 앞의 배포가 끝난 뒤 다음 배포를 진행한다
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/yunjaeyun/all4land_4

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/All4Land_4
            # compose 파일 변경도 함께 반영한다 (.env는 git 제외 대상이라 그대로 남는다)
            git checkout -q main
            git pull -q --ff-only
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull backend
            docker compose up -d
            docker image prune -f
