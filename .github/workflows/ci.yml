# PR마다 빌드와 테스트를 돌린다. main push 때는 deploy.yml이 이 워크플로를 호출한다.
name: CI

on:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 테스트는 map-only 프로필로 돌기 때문에 DB 없이 실행된다
      - run: ./gradlew build --no-daemon
