spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  compression:
    enabled: true
    mime-types: application/geo+json,application/json,text/html,text/css,application/javascript

google:
  maps:
    key: ${GOOGLE_MAPS_API_KEY:}
