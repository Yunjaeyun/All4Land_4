<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 · SafeStay London</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card" aria-labelledby="login-title">
        <a class="auth-brand" th:href="@{/}">SafeStay <span>London</span></a>
        <h1 id="login-title">로그인</h1>
        <p class="auth-sub">로그인하면 맛집을 등록하고 나만의 장소를 저장할 수 있어요.</p>

        <p th:if="${param.error}" class="auth-message error" role="alert">아이디 또는 비밀번호가 올바르지 않아요.</p>
        <p th:if="${param.signup}" class="auth-message success" role="status">회원가입이 끝났어요. 로그인해 주세요.</p>

        <form th:action="@{/login}" method="post" class="auth-form">
            <label for="username">아이디</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="아이디를 입력하세요" required>

            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>

            <button type="submit" class="auth-submit">로그인</button>
        </form>

        <div class="auth-divider"></div>
        <p class="auth-foot">아직 계정이 없나요? <a th:href="@{/signup}">회원가입</a></p>
        <p class="auth-foot"><a th:href="@{/map}">로그인 없이 둘러보기</a></p>
    </section>
</main>
</body>
</html>
