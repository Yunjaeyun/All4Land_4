<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 · SafeStay London</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card" aria-labelledby="signup-title">
        <a class="auth-brand" th:href="@{/}">SafeStay <span>London</span></a>
        <h1 id="signup-title">회원가입</h1>
        <p class="auth-sub">계정을 만들면 맛집 등록과 나만의 장소 저장을 바로 쓸 수 있어요.</p>

        <form th:action="@{/signup}" th:object="${signupRequest}" method="post" class="auth-form">
            <label for="loginId">아이디</label>
            <input id="loginId" type="text" th:field="*{loginId}" autocomplete="username" placeholder="영문, 숫자, 밑줄 4~50자" required
                   th:attr="aria-invalid=${#fields.hasErrors('loginId')}">
            <p class="auth-field-error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></p>

            <label for="password">비밀번호</label>
            <input id="password" type="password" th:field="*{password}" autocomplete="new-password" placeholder="8자 이상" required
                   th:attr="aria-invalid=${#fields.hasErrors('password')}">
            <p class="auth-field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

            <label for="passwordConfirm">비밀번호 확인</label>
            <input id="passwordConfirm" type="password" th:field="*{passwordConfirm}" autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력하세요" required
                   th:attr="aria-invalid=${#fields.hasErrors('passwordConfirm')}">
            <p class="auth-field-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>

            <label for="nickname">닉네임</label>
            <input id="nickname" type="text" th:field="*{nickname}" autocomplete="nickname" required
                   th:attr="aria-invalid=${#fields.hasErrors('nickname')}">
            <p class="auth-field-error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>

            <button type="submit" class="auth-submit">가입하기</button>
        </form>

        <div class="auth-divider"></div>
        <p class="auth-foot">이미 계정이 있나요? <a th:href="@{/login}">로그인</a></p>
    </section>
</main>
</body>
</html>
