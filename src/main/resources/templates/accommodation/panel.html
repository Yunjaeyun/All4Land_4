<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside id="accommodation-panel" class="map-panel accommodation-panel" th:fragment="panel" aria-label="숙소 찾기" hidden>
    <header class="panel-head">
        <h1>숙소 찾기</h1>
        <p class="description">어느 동네에서 머물지 골라 보세요.</p>
    </header>
    <section class="step" aria-labelledby="accommodation-borough-heading">
        <h2 id="accommodation-borough-heading" class="step-title">동네 고르기</h2>
        <div id="accommodation-boroughs" class="borough-chips" role="group" aria-label="자치구"></div>
    </section>
    <form id="accommodation-form" class="accommodation-form">
        <label class="switch-row">
            <span>안전한 숙소부터 보기</span>
            <input name="safestTop" type="checkbox" value="true">
            <span class="switch" aria-hidden="true"></span>
        </label>
        <details class="more-filters">
            <summary>세부 조건<span class="hint">이름 · 방 유형 · 가격 · 인원</span></summary>
            <label>지역 또는 숙소 이름
                <input name="keyword" maxlength="100" placeholder="예: Camden" autocomplete="off">
            </label>
            <fieldset class="chips">
                <legend>안전 등급</legend>
                <div class="seg-options">
                    <label class="chip"><input type="radio" name="maxSafetyLevel" value="" checked><span>전체</span></label>
                    <label class="chip"><input type="radio" name="maxSafetyLevel" value="3"><span>보통 이상</span></label>
                    <label class="chip"><input type="radio" name="maxSafetyLevel" value="2"><span>안전</span></label>
                    <label class="chip"><input type="radio" name="maxSafetyLevel" value="1"><span>매우 안전</span></label>
                </div>
            </fieldset>
            <fieldset class="chips">
                <legend>방 유형</legend>
                <div class="seg-options">
                    <label class="chip"><input type="radio" name="roomType" value="" checked><span>전체</span></label>
                    <label class="chip"><input type="radio" name="roomType" value="ENTIRE_HOME"><span>전체 집</span></label>
                    <label class="chip"><input type="radio" name="roomType" value="PRIVATE_ROOM"><span>개인실</span></label>
                    <label class="chip"><input type="radio" name="roomType" value="SHARED_ROOM"><span>공용실</span></label>
                </div>
            </fieldset>
            <div class="two">
                <label>최소 총가격
                    <input name="minPrice" type="number" min="0" step="1" inputmode="decimal">
                </label>
                <label>최대 총가격
                    <input name="maxPrice" type="number" min="0" step="1" inputmode="decimal">
                </label>
            </div>
            <div class="two">
                <label>인원 (이상)
                    <input name="guests" type="number" min="1" max="20" step="1">
                </label>
                <label>침실 (이상)
                    <input name="minBedrooms" type="number" min="0" max="20" step="1">
                </label>
            </div>
            <div class="two">
                <label>최소 만족도 (0~100)
                    <input name="minSatisfaction" type="number" min="0" max="100" step="1">
                </label>
                <label>정렬
                    <select name="sort">
                        <option value="PRICE_ASC">가격 낮은순</option>
                        <option value="PRICE_DESC">가격 높은순</option>
                        <option value="SATISFACTION_DESC">만족도 높은순</option>
                        <option value="CITY_CENTER_ASC">시내 가까운순</option>
                        <option value="METRO_ASC">지하철 가까운순</option>
                    </select>
                </label>
            </div>
            <label class="check">
                <input name="superhostOnly" type="checkbox" value="true">
                슈퍼호스트만
            </label>
        </details>
        <label class="inline-field">
            표시 개수
            <select name="size">
                <option value="10">10개</option>
                <option value="20">20개</option>
                <option value="30" selected>30개</option>
                <option value="50">50개</option>
                <option value="all">전체</option>
            </select>
        </label>
        <div class="actions">
            <button id="accommodation-reset" class="button secondary" type="button">초기화</button>
            <button id="accommodation-submit" class="button" type="submit" disabled>검색</button>
        </div>
    </form>
    <p id="accommodation-message" class="accommodation-message" role="status" aria-live="polite" hidden></p>
</aside>
<aside id="accommodation-results" class="map-panel accommodation-results" th:fragment="results" aria-label="숙소 검색 결과" hidden>
    <section class="accommodation-list-section" aria-labelledby="accommodation-list-heading">
        <h2 id="accommodation-list-heading">검색 결과 <span id="accommodation-count">0</span></h2>
        <ul id="accommodation-list" class="accommodation-list"></ul>
        <p id="accommodation-empty" class="accommodation-empty" hidden>조건에 맞는 숙소가 없습니다.</p>
    </section>
</aside>
</body>
</html>
