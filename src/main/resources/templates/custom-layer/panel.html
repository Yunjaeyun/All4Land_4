
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside id="custom-layer-panel" class="map-panel custom-layer-panel" th:fragment="panel" aria-label="나만의 장소 지도">
    <h1>나만의 장소 지도</h1>
    <p class="description">좋아하는 장소를 지도에 표시해 두고, 시간대별로 다시 찾아볼 수 있어요.</p>
    <div class="layer-tabs" role="tablist" aria-label="장소 작업">
        <button id="layer-add-tab" type="button" role="tab" aria-controls="layer-add" aria-selected="true" data-layer-tab="layer-add">장소 표시하기</button>
        <button id="layer-query-tab" type="button" role="tab" aria-controls="layer-query" aria-selected="false" tabindex="-1" data-layer-tab="layer-query">이 시간에 갈 곳 찾기</button>
    </div>
    <section id="layer-add" role="tabpanel" aria-labelledby="layer-add-tab">
        <form id="layer-add-form">
            <label for="layer-name">장소 이름</label>
            <input id="layer-name" name="name" maxlength="100" placeholder="9월 오후 6시 노을 명소" required>
            <div class="layer-fields">
                <div><label for="layer-month">월</label><select id="layer-month" name="month" class="month-options"></select></div>
                <div><label for="layer-time">시간</label><input id="layer-time" name="time" type="time" value="18:00" required></div>
            </div>
            <fieldset class="draw-tools">
                <legend>지도에 표시하기</legend>
                <div class="draw-modes" role="group" aria-label="표시 도구">
                    <button type="button" data-draw-mode="select" aria-pressed="true" disabled>선택·수정</button>
                    <button type="button" data-draw-mode="marker" aria-pressed="false" disabled>장소 찍기</button>
                    <button type="button" data-draw-mode="polyline" aria-pressed="false" disabled>동선 그리기</button>
                    <button type="button" data-draw-mode="polygon" aria-pressed="false" disabled>구역 그리기</button>
                    <button type="button" data-draw-mode="rectangle" aria-pressed="false" disabled>사각 구역</button>
                    <button type="button" data-draw-mode="circle" aria-pressed="false" disabled>원형 구역</button>
                </div>
                <details class="layer-more">
                    <summary>표시 색 바꾸기</summary>
                    <label for="draw-color">표시 색상</label><input id="draw-color" type="color" value="#3d6b4f">
                </details>
                <div class="draw-actions">
                    <button id="draw-finish" type="button" disabled>완료</button>
                    <button id="draw-cancel" type="button" disabled>취소</button>
                    <button id="draw-delete" type="button" disabled>선택 지우기</button>
                </div>
                <p id="draw-status" class="layer-hint" role="status">지도가 준비되면 도구를 사용할 수 있어요.</p>
                <p id="draw-count" class="layer-hint">아직 저장하지 않은 표시 0개</p>
            </fieldset>
            <details class="layer-more">
                <summary>사진 추가 (선택)</summary>
                <label for="layer-photo">장소 사진 (5MB 이하)</label>
                <input id="layer-photo" type="file" accept="image/jpeg,image/png,image/webp">
                <img id="layer-photo-preview" alt="선택한 장소 사진 미리보기" hidden>
            </details>
            <details class="layer-more">
                <summary>좌표로 장소 찍기 (선택)</summary>
                <p class="layer-hint">지도를 찍기 어렵다면 위도·경도를 직접 적어 보세요. 런던 중심은 51.5074, -0.1278 입니다.</p>
                <div class="layer-fields">
                    <div><label for="layer-latitude">위도</label><input id="layer-latitude" type="number" min="-90" max="90" step="any" placeholder="51.5074"></div>
                    <div><label for="layer-longitude">경도</label><input id="layer-longitude" type="number" min="-180" max="180" step="any" placeholder="-0.1278"></div>
                </div>
                <button id="add-coordinate-marker" type="button">이 좌표에 찍기</button>
            </details>
            <p id="layer-feedback" class="layer-hint" role="status"></p>
            <button id="layer-register" class="layer-submit" type="submit" disabled>장소 저장</button>
        </form>
    </section>
    <section id="layer-query" role="tabpanel" aria-labelledby="layer-query-tab" hidden>
        <form id="layer-query-form">
            <label for="query-month">월</label><select id="query-month" name="month" class="month-options"></select>
            <div class="layer-fields">
                <div><label for="query-start">시작 시간</label><input id="query-start" type="time" value="17:00" required></div>
                <div><label for="query-end">종료 시간</label><input id="query-end" type="time" value="19:00" required></div>
            </div>
            <p class="layer-hint">시작·종료 시간을 포함합니다. 종료가 시작보다 이르면 자정을 넘는 시간대로 조회합니다.</p>
            <button id="layer-query-submit" class="layer-submit" type="submit" disabled>조회</button>
            <button id="layer-query-reset" class="layer-secondary" type="button">조건 초기화</button>
        </form>
        <p id="layer-query-status" class="layer-hint" role="status">조건을 선택하고 조회하세요.</p>
    </section>
    <section aria-label="표시한 장소 관리">
        <h2 class="draw-list-title">내가 표시한 장소</h2>
        <ul id="draw-layers" class="draw-layers" aria-label="내가 표시한 장소"></ul>
        <section id="layer-details" hidden aria-label="선택한 장소">
            <h2 id="layer-details-title" class="draw-list-title"></h2>
            <p id="layer-details-meta" class="layer-hint"></p>
            <img id="layer-details-photo" class="layer-image" alt="선택한 레이어 사진" hidden>
        </section>
        <form id="layer-edit-form" hidden>
            <h2 class="draw-list-title">장소 정보 수정</h2>
            <label for="edit-layer-name">장소 이름</label><input id="edit-layer-name" maxlength="100" required>
            <div class="layer-fields">
                <div><label for="edit-layer-month">월</label><select id="edit-layer-month" class="month-options"></select></div>
                <div><label for="edit-layer-time">시간</label><input id="edit-layer-time" type="time" required></div>
            </div>
            <label for="edit-layer-photo">사진 교체</label><input id="edit-layer-photo" type="file" accept="image/jpeg,image/png,image/webp">
            <label class="layer-check"><input id="edit-remove-photo" type="checkbox"> 기존 사진 제거</label>
            <p id="layer-edit-status" class="layer-hint" role="status"></p>
            <button class="layer-submit" type="submit">수정 저장</button>
            <button id="layer-edit-cancel" class="layer-secondary" type="button">수정 취소</button>
        </form>
    </section>
</aside>
</body>
</html>
