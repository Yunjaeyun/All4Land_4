<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>London Safety Map</title>
    <style>#map { height: 100vh; width: 100%; } body { margin: 0; }</style>
</head>
<body>
<div id="map"></div>
<script th:inline="javascript">
    function initMap() {
        new google.maps.Map(document.getElementById("map"), {
            center: { lat: 51.5074, lng: -0.1278 }, // 런던 중심
            zoom: 12
        });
    }
</script>
<script th:src="|https://maps.googleapis.com/maps/api/js?key=${mapsKey}&callback=initMap|" async defer></script>
</body>
</html>
