<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeStay London · 안전한 동네</title>
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/custom-layer/panel.css}">
    <link rel="stylesheet" th:href="@{/css/restaurant/panel.css}">
    <link rel="stylesheet" th:href="@{/css/accommodation/panel.css}">
    <style>
        :root { color-scheme: light; font-family: Arial, "Noto Sans KR", sans-serif; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; background: var(--paper, #f2eee6); }
        #map { width: 100%; height: calc(100% - var(--app-header-height)); }

        .map-panel {
            position: fixed;
            z-index: 2;
            top: calc(var(--app-header-height) + 16px);
            left: 16px;
            width: min(340px, calc(100vw - 32px));
            max-height: calc(100vh - var(--app-header-height) - 32px);
            overflow-y: auto;
            padding: 22px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 8px 24px rgba(43, 42, 39, 0.12);
            scrollbar-width: none;
        }
        .map-panel::-webkit-scrollbar { display: none; }

        h1 { margin: 0 0 4px; color: var(--ink); font-size: 22px; letter-spacing: -0.4px; }
        .description { margin: 0 0 16px; color: var(--ink-2); font-size: 12px; line-height: 1.5; }
        .status, .attribution { margin-top: 12px; color: var(--ink-3); font-size: 10px; line-height: 1.45; }
        [hidden] { display: none !important; }

        .step-title { margin: 0 0 10px; color: var(--ink); font-size: 14px; font-weight: 700; }
        .rank-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--seg); }
        .borough-rank { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
        .borough-rank li { display: flex; }
        .borough-rank button { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 14px; background: #ffffff; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
        .borough-rank button:hover, .borough-rank button[aria-pressed="true"] { border-color: var(--sage); }
        .borough-rank .num { flex: none; width: 22px; color: var(--ink-3); font-size: 12px; text-align: center; }
        .borough-rank .chip { flex: none; width: 10px; height: 10px; border-radius: 50%; }
        .borough-rank .name { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .borough-rank .value { flex: none; color: var(--ink-2); font-size: 12px; }

        .theme-list { display: grid; gap: 8px; margin: 0 0 16px; padding: 0; border: 0; min-width: 0; }
        .theme-list legend { margin-bottom: 8px; padding: 0; color: var(--ink-2); font-size: 12px; font-weight: 500; }
        .legend { margin-top: 0; }
        .legend-heading { margin: 0 0 10px; color: var(--ink); font-size: 13px; font-weight: 700; }
        .legend-items { display: grid; gap: 7px; }
        .legend-item { display: grid; grid-template-columns: 16px 1fr; align-items: center; gap: 8px; color: var(--ink-2); font-size: 11px; }
        .legend-swatch { width: 16px; height: 12px; border: 1px solid rgba(43, 42, 39, 0.14); border-radius: 4px; }
        .legend-note { margin: 10px 0 0; color: var(--ink-3); font-size: 10px; line-height: 1.45; }
    </style>
    <link rel="stylesheet" th:href="@{/css/mobile.css}">
</head>
<body data-active-menu="map">
<header th:replace="~{fragments/navigation :: navigation('map')}"></header>
<aside id="map-panel" class="map-panel" aria-label="안전한 동네" hidden>
    <h1>안전한 동네</h1>
    <p class="description">하나를 고르면 지도 색과 설명이 바뀌어요.</p>

    <fieldset class="theme-list">
        <legend>표시할 정보</legend>
        <label class="layer-toggle" for="theme-safety">
            <input id="theme-safety" type="checkbox" data-theme="safety" checked disabled>
            치안사건률
        </label>
        <label class="layer-toggle" for="theme-accommodation">
            <input id="theme-accommodation" type="checkbox" data-theme="accommodation" disabled>
            숙소 중위 총가격
        </label>
        <label class="layer-toggle" for="theme-population">
            <input id="theme-population" type="checkbox" data-theme="population" disabled>
            인구밀도
        </label>
        <label class="layer-toggle" for="theme-greenspace">
            <input id="theme-greenspace" type="checkbox" data-theme="greenspace" disabled>
            공개녹지 면적비율
        </label>
    </fieldset>

    <section id="legend" class="legend" aria-live="polite" hidden>
        <h2 id="legend-heading" class="legend-heading"></h2>
        <div id="legend-items" class="legend-items"></div>
        <p id="legend-note" class="legend-note"></p>
    </section>

    <section id="rank-section" class="rank-section" aria-labelledby="rank-heading" hidden>
        <h2 id="rank-heading" class="step-title">동네 순위</h2>
        <ol id="borough-rank" class="borough-rank"></ol>
    </section>

    <div id="status" class="status" role="status" aria-live="polite">데이터를 불러오는 중…</div>
    <div class="attribution">
        GLA · data.police.uk · ONS · Kaggle Airbnb<br>
        Contains National Statistics and OS data © Crown copyright and database right
    </div>
</aside>
<aside th:replace="~{custom-layer/panel :: panel}"></aside>
<aside th:replace="~{restaurant/panel :: panel}"></aside>
<aside th:replace="~{accommodation/panel :: panel}"></aside>
<aside th:replace="~{accommodation/panel :: results}"></aside>
<div id="map" aria-label="런던 안전한 동네 지도"></div>
<script th:src="@{/js/custom-layer/panel.js}"></script>
<script th:src="@{/js/custom-layer/draw.js}"></script>
<script th:src="@{/js/restaurant/restaurant.js}"></script>
<script th:src="@{/js/accommodation/accommodation.js}"></script>
<script th:src="@{/js/mobile.js}"></script>

<script>
    const MISSING_COLOR = "#bdbdbd";
    const THEMES = {
        accommodation: {
            heading: "Airbnb 숙소 중위 총가격",
            valueProperty: "accommodationMedianPrice",
            levelProperty: "accommodationLevel",
            colors: ["#eff3ff", "#bdd7e7", "#6baed6", "#3182bd", "#08519c"],
            decimals: 2,
            suffix: "",
            note: "표본 5건 이상 LSOA만 표시 · 원본 스냅샷 시점 미상"
        },
        safety: {
            heading: "인구 1,000명당 연간 범죄 발생",
            valueProperty: "safetyIncidentRate",
            levelProperty: "safetyLevel",
            colors: ["#1a9850", "#91cf60", "#ffffbf", "#fc8d59", "#d73027"],
            decimals: 2,
            suffix: "건",
            note: "data.police.uk 2024년 12개월 · MPS와 City of London Police"
        },
        population: {
            heading: "인구밀도",
            valueProperty: "populationDensity",
            levelProperty: "populationLevel",
            colors: ["#ffffb2", "#fecc5c", "#fd8d3c", "#f03b20", "#bd0026"],
            decimals: 0,
            suffix: "명/km²",
            note: "ONS 2024년 중간연도 인구 ÷ LSOA 면적"
        },
        greenspace: {
            heading: "공개녹지 면적비율",
            valueProperty: "greenspacePercent",
            levelProperty: "greenspaceLevel",
            colors: ["#edf8e9", "#bae4b3", "#74c476", "#31a354", "#006d2c"],
            decimals: 2,
            suffix: "%",
            note: "OS Open Greenspace 2026-04 · 일반화 경계에 따른 근사 면적"
        }
    };

    async function initMap() {
        const map = new google.maps.Map(document.getElementById("map"), {
            center: { lat: 51.5074, lng: -0.1278 },
            zoom: 10,
            minZoom: 9,
            mapTypeControl: false,
            streetViewControl: false,
            fullscreenControl: false,
            // 모바일에서는 하단 시트에 가려지므로 줌 버튼 대신 두 손가락 확대를 쓴다
            zoomControl: !window.matchMedia("(max-width: 720px)").matches,
            styles: [
                { featureType: "poi", stylers: [{ visibility: "off" }] },
                { featureType: "transit", stylers: [{ visibility: "off" }] }
            ]
        });

        new window.CustomLayerDraw(map);
        initRestaurants(map);
        initAccommodations(map);

        const legend = document.getElementById("legend");
        const legendHeading = document.getElementById("legend-heading");
        const legendItems = document.getElementById("legend-items");
        const legendNote = document.getElementById("legend-note");
        const rankList = document.getElementById("borough-rank");
        const status = document.getElementById("status");
        let metadata;
        let resumeTimer;
        let activeTheme = "safety";
        const rankings = {};
        const rankHeading = document.getElementById("rank-heading");
        const rankSection = document.getElementById("rank-section");
        const checkboxes = [...document.querySelectorAll("[data-theme]")];

        function formatValue(value, config = THEMES.safety) {
            return Number(value).toLocaleString("ko-KR", {
                minimumFractionDigits: config.decimals,
                maximumFractionDigits: config.decimals
            });
        }

        function intervalLabels(themeKey) {
            const config = THEMES[themeKey];
            const breaks = metadata.indicators[themeKey].breaks;
            if (themeKey === "greenspace") {
                return [
                    `0${config.suffix}`,
                    `0 초과 – ${formatValue(breaks[0], config)}${config.suffix}`,
                    `${formatValue(breaks[0], config)} 초과 – ${formatValue(breaks[1], config)}${config.suffix}`,
                    `${formatValue(breaks[1], config)} 초과 – ${formatValue(breaks[2], config)}${config.suffix}`,
                    `${formatValue(breaks[2], config)}${config.suffix} 초과`
                ];
            }
            return [
                `${formatValue(breaks[0], config)}${config.suffix} 이하`,
                `${formatValue(breaks[0], config)} 초과 – ${formatValue(breaks[1], config)}${config.suffix}`,
                `${formatValue(breaks[1], config)} 초과 – ${formatValue(breaks[2], config)}${config.suffix}`,
                `${formatValue(breaks[2], config)} 초과 – ${formatValue(breaks[3], config)}${config.suffix}`,
                `${formatValue(breaks[3], config)}${config.suffix} 초과`
            ];
        }

        function renderLegend(themeKey) {
            const config = THEMES[themeKey];
            legendHeading.textContent = config.heading;
            legendNote.textContent = `${config.note} · 회색은 결측`;
            legendItems.replaceChildren();
            intervalLabels(themeKey).forEach((label, index) => {
                const item = document.createElement("div");
                const swatch = document.createElement("span");
                const text = document.createElement("span");
                item.className = "legend-item";
                swatch.className = "legend-swatch";
                swatch.style.backgroundColor = config.colors[index];
                text.textContent = label;
                item.append(swatch, text);
                legendItems.append(item);
            });
            legend.hidden = false;
        }

        function applyTheme(themeKey) {
            const config = THEMES[themeKey];
            // 맛집 보기에서는 음식점 아이콘이 보이도록 주제도를 옅게 한다
            const fillOpacity = document.body.dataset.activeMenu === "restaurant" ? 0.3 : 0.5;
            map.data.setStyle((feature) => {
                const level = feature.getProperty(config.levelProperty);
                return {
                    fillColor: level ? config.colors[level - 1] : MISSING_COLOR,
                    fillOpacity,
                    strokeColor: "#ffffff",
                    strokeOpacity: 0.5,
                    strokeWeight: 0.25,
                    clickable: document.body.dataset.activeMenu === "accommodation"
                };
            });
            map.data.setMap(map);
            renderLegend(themeKey);
            renderRanking(themeKey);
        }

        function selectTheme(themeKey) {
            checkboxes.forEach((checkbox) => {
                checkbox.checked = checkbox.dataset.theme === themeKey;
            });
            activeTheme = themeKey;
            applyTheme(themeKey);
        }

        window.addEventListener("app:menu", () => {
            if (activeTheme && metadata) applyTheme(activeTheme);
        });

        checkboxes.forEach((checkbox) => {
            checkbox.addEventListener("change", () => {
                if (checkbox.checked) {
                    selectTheme(checkbox.dataset.theme);
                } else if (activeTheme === checkbox.dataset.theme) {
                    activeTheme = null;
                    map.data.setMap(null);
                    legend.hidden = true;
                    rankSection.hidden = true;
                }
            });
        });

        async function loadSafetyData() {
            const response = await fetch("/data/london-lsoa-themes.json");
            if (!response.ok) throw new Error(`Safety data HTTP ${response.status}`);
            return response.json();
        }

        const boroughBounds = new Map();
        function extendBounds(bounds, coordinates) {
            if (typeof coordinates[0] === "number") {
                bounds.extend({ lat: coordinates[1], lng: coordinates[0] });
                return;
            }
            coordinates.forEach((child) => extendBounds(bounds, child));
        }

        // 동네 순위: 각 지표를 자치구 단위로 합산한 뒤 정렬한다.
        // 숙소 가격은 LSOA 중위가격을 표본 수로 가중 평균한 근사값이다.
        const RANK = {
            safety: { title: "안전한 곳부터", ascending: true, scale: 1000,
                weight: (p) => (p.crimeCount == null || p.population == null) ? null : [p.crimeCount, p.population] },
            accommodation: { title: "저렴한 곳부터", ascending: true, scale: 1,
                weight: (p) => (p.accommodationMedianPrice == null || !p.accommodationSampleCount) ? null : [p.accommodationMedianPrice * p.accommodationSampleCount, p.accommodationSampleCount] },
            population: { title: "인구 많은 곳부터", ascending: false, scale: 1,
                weight: (p) => (p.population == null || p.areaKm2 == null) ? null : [p.population, p.areaKm2] },
            greenspace: { title: "녹지 많은 곳부터", ascending: false, scale: 1,
                weight: (p) => (p.greenspacePercent == null || p.areaKm2 == null) ? null : [p.greenspacePercent * p.areaKm2, p.areaKm2] }
        };

        function levelFor(value, themeKey) {
            const breaks = metadata.indicators[themeKey].breaks;
            const above = breaks.filter((limit) => value > limit).length;
            if (themeKey === "greenspace") return value <= 0 ? 1 : 2 + above;
            return 1 + above;
        }

        function buildRanking(geojson, themeKey) {
            const config = RANK[themeKey];
            const groups = new Map();
            geojson.features.forEach((feature) => {
                const properties = feature.properties;
                if (!properties.borough) return;
                const pair = config.weight(properties);
                if (!pair) return;
                const group = groups.get(properties.borough) || { num: 0, den: 0 };
                group.num += pair[0];
                group.den += pair[1];
                groups.set(properties.borough, group);
            });
            return [...groups]
                .filter(([, group]) => group.den > 0)
                .map(([name, group]) => {
                    const value = config.scale * group.num / group.den;
                    return { name, value, level: levelFor(value, themeKey) };
                })
                .sort((a, b) => (config.ascending ? a.value - b.value : b.value - a.value));
        }

        const boroughFeatures = new Map();
        function focusBorough(name) {
            const bounds = boroughBounds.get(name);
            if (bounds && !bounds.isEmpty()) map.fitBounds(bounds, 40);
            rankList.querySelectorAll("button").forEach((button) => {
                button.setAttribute("aria-pressed", String(button.dataset.borough === name));
            });
        }

        function renderRanking(themeKey) {
            const ranking = rankings[themeKey] || [];
            const config = THEMES[themeKey];
            rankSection.hidden = ranking.length === 0;
            rankHeading.textContent = `동네 순위 · ${RANK[themeKey].title}`;
            rankList.replaceChildren();
            ranking.forEach((entry, index) => {
                const item = document.createElement("li");
                const button = document.createElement("button");
                const num = document.createElement("span");
                const dot = document.createElement("span");
                const name = document.createElement("span");
                const value = document.createElement("span");
                button.type = "button";
                button.dataset.borough = entry.name;
                button.setAttribute("aria-pressed", "false");
                num.className = "num";
                num.textContent = String(index + 1);
                dot.className = "chip";
                dot.style.backgroundColor = config.colors[entry.level - 1];
                name.className = "name";
                name.textContent = entry.name;
                value.className = "value";
                value.textContent = `${formatValue(entry.value, config)}${config.suffix}`;
                button.append(num, dot, name, value);
                button.addEventListener("click", () => focusBorough(entry.name));
                item.append(button);
                rankList.append(item);
            });
        }

        try {
            const geojson = await loadSafetyData();
            metadata = geojson.metadata;
            map.data.addGeoJson(geojson);
            geojson.features.forEach((feature) => {
                const borough = feature.properties.borough;
                const bounds = boroughBounds.get(borough) || new google.maps.LatLngBounds();
                extendBounds(bounds, feature.geometry.coordinates);
                boroughBounds.set(borough, bounds);
            });
            Object.keys(THEMES).forEach((key) => { rankings[key] = buildRanking(geojson, key); });
            checkboxes.forEach((checkbox) => checkbox.disabled = false);
            selectTheme("safety");
            status.hidden = true;
        } catch (error) {
            activeTheme = null;
            status.hidden = false;
            status.textContent = "데이터를 불러오지 못했습니다. 새로고침해 주세요. 나만의 장소 지도와 숙소 찾기는 계속 사용할 수 있습니다.";
            console.error(error);
        }

        function suspendRendering() {
            if (!activeTheme) return;
            clearTimeout(resumeTimer);
            map.data.setMap(null);
        }
        function resumeRendering() {
            clearTimeout(resumeTimer);
            resumeTimer = setTimeout(() => {
                if (activeTheme) map.data.setMap(map);
            }, 100);
        }
        map.addListener("zoom_changed", suspendRendering);
        map.addListener("dragstart", suspendRendering);
        map.addListener("idle", resumeRendering);
        map.data.addListener("click", (event) => {
            if (document.body.dataset.activeMenu !== "accommodation") return;
            const borough = event.feature.getProperty("borough");
            const bounds = boroughBounds.get(borough);
            window.dispatchEvent(new CustomEvent("accommodation:borough-click", {
                detail: { borough, bounds: bounds && !bounds.isEmpty() ? bounds.toJSON() : null }
            }));
        });

        map.data.forEach((feature) => {
            const borough = feature.getProperty("borough");
            if (!boroughFeatures.has(borough)) boroughFeatures.set(borough, []);
            boroughFeatures.get(borough).push(feature);
        });
        const boroughTip = new google.maps.InfoWindow({ disableAutoPan: true, headerDisabled: true, pixelOffset: new google.maps.Size(0, -8) });
        let boroughCounts = null;
        fetch("/api/accommodations/borough-counts")
            .then((response) => (response.ok ? response.json() : null))
            .then((counts) => { boroughCounts = counts; })
            .catch(() => {});
        let hoveredBorough = null;
        function highlightBorough(borough) {
            (boroughFeatures.get(hoveredBorough) || []).forEach((feature) => map.data.revertStyle(feature));
            hoveredBorough = borough;
            (boroughFeatures.get(borough) || []).forEach((feature) => map.data.overrideStyle(feature, { fillOpacity: 0.85 }));
        }
        map.data.addListener("mouseover", (event) => {
            if (document.body.dataset.activeMenu !== "accommodation") return;
            const borough = event.feature.getProperty("borough");
            if (borough !== hoveredBorough) {
                highlightBorough(borough);
                const label = document.createElement("div");
                label.style.cssText = "padding:2px 4px;";
                const name = document.createElement("div");
                name.textContent = borough;
                name.style.cssText = "font-size:12px;font-weight:700;color:#2b2a27;";
                label.append(name);
                if (boroughCounts) {
                    const count = document.createElement("div");
                    count.textContent = `숙소 ${(boroughCounts[borough] ?? 0).toLocaleString("ko-KR")}개`;
                    count.style.cssText = "font-size:11px;color:#6e6a60;";
                    label.append(count);
                }
                boroughTip.setContent(label);
                boroughTip.open(map);
            }
            boroughTip.setPosition(event.latLng);
        });
        map.data.addListener("mousemove", (event) => {
            if (hoveredBorough) boroughTip.setPosition(event.latLng);
        });
        map.data.addListener("mouseout", () => {
            highlightBorough(null);
            boroughTip.close();
        });
    }

    window.gm_authFailure = () => {
        const status = document.getElementById("status");
        status.hidden = false;
        status.textContent = "Google Maps API 키를 확인해 주세요.";
    };
</script>
<script th:src="|https://maps.googleapis.com/maps/api/js?key=${mapsKey}&callback=initMap|" async defer></script>
</body>
</html>
