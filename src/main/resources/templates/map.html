<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>런던 지역별 GIS 주제도</title>
    <link rel="stylesheet" th:href="@{/css/navigation.css}">
    <link rel="stylesheet" th:href="@{/css/custom-layer/panel.css}">
    <style>
        :root { color-scheme: light; font-family: Arial, "Noto Sans KR", sans-serif; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        #map { width: 100%; height: calc(100% - var(--app-header-height)); }

        .map-panel {
            position: fixed;
            z-index: 2;
            top: calc(var(--app-header-height) + 16px);
            left: 16px;
            width: min(350px, calc(100vw - 32px));
            max-height: calc(100vh - var(--app-header-height) - 32px);
            overflow-y: auto;
            padding: 17px;
            border: 1px solid #d7dee5;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 4px 18px rgba(29, 45, 61, 0.18);
            max-height: calc(100vh - 32px);
            overflow-y: auto;
        }

        h1 { margin: 0 0 5px; color: #182733; font-size: 18px; }
        .description { margin: 0 0 13px; color: #5d6b76; font-size: 12px; line-height: 1.5; }
        .layer-list { display: grid; gap: 7px; margin: 0; padding: 0; border: 0; }
        .layer-list legend { margin-bottom: 6px; color: #40505c; font-size: 12px; font-weight: 700; }

        .layer-toggle {
            display: flex;
            align-items: center;
            gap: 9px;
            min-height: 40px;
            padding: 9px 11px;
            border: 1px solid #cfd8df;
            border-radius: 8px;
            color: #1d2d39;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }
        .layer-toggle:has(input:checked) { border-color: #596d7c; background: #f5f8fa; }
        .layer-toggle input { width: 18px; height: 18px; margin: 0; accent-color: #345f82; }
        .layer-toggle input:disabled { cursor: wait; }

        .legend { margin-top: 13px; border-top: 1px solid #e3e8ec; padding-top: 12px; }
        .legend-heading { margin: 0 0 9px; color: #263743; font-size: 12px; font-weight: 700; }
        .legend-items { display: grid; gap: 6px; }
        .legend-item { display: grid; grid-template-columns: 16px 1fr; align-items: center; gap: 7px; color: #52616c; font-size: 11px; }
        .legend-swatch { width: 16px; height: 12px; border: 1px solid rgba(25, 35, 42, 0.14); border-radius: 2px; }
        .legend-note { margin: 9px 0 0; color: #78858e; font-size: 10px; line-height: 1.45; }
        .status, .attribution { margin-top: 10px; color: #78858e; font-size: 10px; line-height: 1.45; }
        [hidden] { display: none !important; }

        .restaurant-section { margin-top: 13px; border-top: 1px solid #e3e8ec; padding-top: 12px; }
        .restaurant-row { display: flex; gap: 7px; }
        .restaurant-row .layer-toggle { flex: 1; }
        .button {
            min-height: 40px;
            padding: 0 13px;
            border: 1px solid #345f82;
            border-radius: 8px;
            background: #345f82;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
        }
        .button.secondary { border-color: #cfd8df; background: #ffffff; color: #40505c; }
        .button:disabled { cursor: not-allowed; opacity: 0.5; }
        .restaurant-hint { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 9px 0 0; color: #345f82; font-size: 12px; font-weight: 700; }
        .restaurant-hint .button { min-height: 30px; }
        .restaurant-form { display: grid; gap: 8px; margin-top: 10px; }
        .restaurant-form label { display: grid; gap: 3px; color: #40505c; font-size: 11px; font-weight: 700; }
        .restaurant-form input { min-height: 34px; padding: 0 9px; border: 1px solid #cfd8df; border-radius: 6px; font: inherit; font-size: 13px; }
        .restaurant-form .coords { margin: 0; color: #78858e; font-size: 11px; }
        .restaurant-form .actions { display: flex; justify-content: flex-end; gap: 7px; }
        .restaurant-message { margin: 8px 0 0; color: #2f7d4f; font-size: 11px; }
        .restaurant-message.error { color: #c0392b; }
        .restaurant-info { max-width: 240px; color: #1d2d39; font-size: 12px; line-height: 1.55; }
        .restaurant-info strong { display: block; margin-bottom: 3px; font-size: 14px; }

        @media (max-width: 520px) {
            .map-panel { top: calc(var(--app-header-height) + 10px); left: 10px; width: calc(100vw - 20px); max-height: calc(100vh - var(--app-header-height) - 20px); overflow-y: auto; }
        }
    </style>
</head>
<body data-active-menu="custom-layer">
<header th:replace="~{fragments/navigation :: navigation('custom-layer')}"></header>
<aside id="map-panel" class="map-panel" aria-label="런던 주제도 레이어 선택" hidden>
    <h1>런던 지역별 GIS 주제도</h1>
    <p class="description">LSOA 2021 구역 기준입니다. 체크박스는 한 번에 한 레이어만 선택됩니다.</p>

    <fieldset class="layer-list">
        <legend>표시할 주제도</legend>
        <label class="layer-toggle" for="theme-accommodation">
            <input id="theme-accommodation" type="checkbox" data-theme="accommodation" disabled>
            숙소 중위 총가격
        </label>
        <label class="layer-toggle" for="theme-safety">
            <input id="theme-safety" type="checkbox" data-theme="safety" checked disabled>
            치안사건률
        </label>
        <label class="layer-toggle" for="theme-population">
            <input id="theme-population" type="checkbox" data-theme="population" disabled>
            인구밀도
        </label>
        <label class="layer-toggle" for="theme-greenspace">
            <input id="theme-greenspace" type="checkbox" data-theme="greenspace" disabled>
            공개녹지 면적비율
        </label>
    </fieldset>

    <section id="legend" class="legend" aria-live="polite" hidden>
        <h2 id="legend-heading" class="legend-heading"></h2>
        <div id="legend-items" class="legend-items"></div>
        <p id="legend-note" class="legend-note"></p>
    </section>

    <section class="restaurant-section" aria-label="맛집">
        <div class="restaurant-row">
            <label class="layer-toggle" for="layer-restaurant">
                <input id="layer-restaurant" type="checkbox" checked disabled>
                맛집
            </label>
            <button id="restaurant-add" class="button" type="button" disabled>맛집 추가</button>
        </div>
        <p id="restaurant-hint" class="restaurant-hint" hidden>
            지도에서 맛집 위치를 클릭하세요.
            <button id="restaurant-pick-cancel" class="button secondary" type="button">취소</button>
        </p>
        <form id="restaurant-form" class="restaurant-form" hidden>
            <p id="restaurant-coords" class="coords"></p>
            <label>상호명 *
                <input name="name" required maxlength="150" autocomplete="off">
            </label>
            <label>주소 *
                <input name="address" required maxlength="255" autocomplete="off">
            </label>
            <label>음식 종류
                <input name="cuisineType" maxlength="50" placeholder="예: Fish and Chips" autocomplete="off">
            </label>
            <label>평점 (0~5)
                <input name="rating" type="number" min="0" max="5" step="0.1">
            </label>
            <div class="actions">
                <button id="restaurant-form-cancel" class="button secondary" type="button">취소</button>
                <button id="restaurant-submit" class="button" type="submit">저장</button>
            </div>
        </form>
        <p id="restaurant-message" class="restaurant-message" role="status" aria-live="polite" hidden></p>
    </section>

    <div id="status" class="status" role="status" aria-live="polite">주제도 데이터를 불러오는 중…</div>
    <div class="attribution">
        GLA · data.police.uk · ONS · OS Open Greenspace · Kaggle Airbnb<br>
        Contains National Statistics and OS data © Crown copyright and database right
    </div>
</aside>
<aside th:replace="~{custom-layer/panel :: panel}"></aside>
<div id="map" aria-label="런던 숙소, 치안, 인구, 녹지 주제도"></div>
<script th:src="@{/js/custom-layer/panel.js}"></script>
<script th:src="@{/js/custom-layer/draw.js}"></script>

<script>
    const MISSING_COLOR = "#bdbdbd";
    const THEMES = {
        accommodation: {
            heading: "Airbnb 숙소 중위 총가격",
            valueProperty: "accommodationMedianPrice",
            levelProperty: "accommodationLevel",
            colors: ["#eff3ff", "#bdd7e7", "#6baed6", "#3182bd", "#08519c"],
            decimals: 2,
            suffix: "",
            note: "표본 5건 이상 LSOA만 표시 · 원본 스냅샷 시점 미상"
        },
        safety: {
            heading: "연간 인구 1,000명당 치안사건",
            valueProperty: "safetyIncidentRate",
            levelProperty: "safetyLevel",
            colors: ["#1a9850", "#91cf60", "#ffffbf", "#fc8d59", "#d73027"],
            decimals: 2,
            suffix: "건",
            note: "data.police.uk 2024년 12개월 · MPS와 City of London Police"
        },
        population: {
            heading: "인구밀도",
            valueProperty: "populationDensity",
            levelProperty: "populationLevel",
            colors: ["#ffffb2", "#fecc5c", "#fd8d3c", "#f03b20", "#bd0026"],
            decimals: 0,
            suffix: "명/km²",
            note: "ONS 2024년 중간연도 인구 ÷ LSOA 면적"
        },
        greenspace: {
            heading: "공개녹지 면적비율",
            valueProperty: "greenspacePercent",
            levelProperty: "greenspaceLevel",
            colors: ["#edf8e9", "#bae4b3", "#74c476", "#31a354", "#006d2c"],
            decimals: 2,
            suffix: "%",
            note: "OS Open Greenspace 2026-04 · 일반화 경계에 따른 근사 면적"
        }
    };

    const SAFETY_LABELS = ["매우 안전", "안전", "보통", "주의", "위험"];

    async function initRestaurants(map) {
        const toggle = document.getElementById("layer-restaurant");
        const addButton = document.getElementById("restaurant-add");
        const hint = document.getElementById("restaurant-hint");
        const form = document.getElementById("restaurant-form");
        const coords = document.getElementById("restaurant-coords");
        const submitButton = document.getElementById("restaurant-submit");
        const message = document.getElementById("restaurant-message");
        const infoWindow = new google.maps.InfoWindow();
        const markers = [];
        let picking = false;
        let picked = null;
        let draftMarker = null;

        function showMessage(text, isError = false) {
            message.textContent = text;
            message.classList.toggle("error", isError);
            message.hidden = false;
        }

        function infoContent(restaurant) {
            const box = document.createElement("div");
            const title = document.createElement("strong");
            box.className = "restaurant-info";
            title.textContent = restaurant.name;
            box.append(title);
            const detail = [restaurant.cuisineType, restaurant.rating != null ? `★ ${restaurant.rating}` : null]
                .filter(Boolean).join(" · ");
            [
                restaurant.address,
                detail,
                `${restaurant.lsoaName} · 치안 ${restaurant.safetyLevel}등급 (${SAFETY_LABELS[restaurant.safetyLevel - 1]})`
            ].filter(Boolean).forEach((line) => {
                const row = document.createElement("div");
                row.textContent = line;
                box.append(row);
            });
            return box;
        }

        function addMarker(restaurant) {
            const marker = new google.maps.Marker({
                position: { lat: Number(restaurant.latitude), lng: Number(restaurant.longitude) },
                map: toggle.checked ? map : null,
                title: restaurant.name,
                zIndex: 10,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 7,
                    fillColor: "#e8590c",
                    fillOpacity: 1,
                    strokeColor: "#ffffff",
                    strokeWeight: 2
                }
            });
            marker.addListener("click", () => {
                infoWindow.setContent(infoContent(restaurant));
                infoWindow.open({ map, anchor: marker });
            });
            markers.push(marker);
        }

        function resetAdding() {
            picking = false;
            picked = null;
            hint.hidden = true;
            form.hidden = true;
            form.reset();
            addButton.disabled = false;
            map.setOptions({ draggableCursor: null });
            if (draftMarker) draftMarker.setMap(null);
            draftMarker = null;
        }

        toggle.addEventListener("change", () => {
            markers.forEach((marker) => marker.setMap(toggle.checked ? map : null));
            if (!toggle.checked) infoWindow.close();
        });

        addButton.addEventListener("click", () => {
            picking = true;
            addButton.disabled = true;
            hint.hidden = false;
            message.hidden = true;
            map.setOptions({ draggableCursor: "crosshair" });
        });
        document.getElementById("restaurant-pick-cancel").addEventListener("click", resetAdding);
        document.getElementById("restaurant-form-cancel").addEventListener("click", resetAdding);

        // 위치 선택 중이거나 폼이 열려 있으면 클릭한 곳으로 위치를 옮긴다
        map.addListener("click", (event) => {
            if (!picking && form.hidden) return;
            picking = false;
            picked = event.latLng;
            hint.hidden = true;
            form.hidden = false;
            map.setOptions({ draggableCursor: null });
            coords.textContent = `위치 ${picked.lat().toFixed(6)}, ${picked.lng().toFixed(6)} · 지도를 다시 클릭하면 위치가 바뀝니다`;
            if (!draftMarker) draftMarker = new google.maps.Marker({ map, zIndex: 20 });
            draftMarker.setPosition(picked);
            form.elements.name.focus();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const data = new FormData(form);
            const rating = data.get("rating");
            submitButton.disabled = true;
            try {
                const response = await fetch("/api/restaurants", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: data.get("name"),
                        address: data.get("address"),
                        cuisineType: data.get("cuisineType") || null,
                        rating: rating === "" ? null : Number(rating),
                        latitude: picked.lat(),
                        longitude: picked.lng()
                    })
                });
                const body = await response.json().catch(() => ({}));
                if (!response.ok) {
                    showMessage(body.message || `저장에 실패했습니다. (HTTP ${response.status})`, true);
                    return;
                }
                toggle.checked = true;
                markers.forEach((marker) => marker.setMap(map));
                addMarker(body);
                resetAdding();
                showMessage(`'${body.name}'을(를) 등록했습니다.`);
            } catch (error) {
                showMessage("서버에 연결할 수 없습니다.", true);
            } finally {
                submitButton.disabled = false;
            }
        });

        try {
            const response = await fetch("/api/restaurants");
            if (!response.ok) throw new Error(`Restaurant HTTP ${response.status}`);
            (await response.json()).forEach(addMarker);
            toggle.disabled = false;
            addButton.disabled = false;
        } catch (error) {
            showMessage("맛집은 DB에 연결된 상태에서만 이용할 수 있습니다.", true);
        }
    }

    async function initMap() {
        const map = new google.maps.Map(document.getElementById("map"), {
            center: { lat: 51.5074, lng: -0.1278 },
            zoom: 10,
            minZoom: 9,
            mapTypeControl: false,
            streetViewControl: false,
            fullscreenControl: false,
            styles: [
                { featureType: "poi", stylers: [{ visibility: "off" }] },
                { featureType: "transit", stylers: [{ visibility: "off" }] }
            ]
        });

        // Initialize editing before fetching themes so a failed data request does not block drawing.
        new window.CustomLayerDraw(map);
        initRestaurants(map);

        const checkboxes = [...document.querySelectorAll("[data-theme]")];
        const legend = document.getElementById("legend");
        const legendHeading = document.getElementById("legend-heading");
        const legendItems = document.getElementById("legend-items");
        const legendNote = document.getElementById("legend-note");
        const status = document.getElementById("status");
        let metadata;
        let activeTheme = "safety";
        let resumeTimer;

        function formatValue(value, config) {
            return Number(value).toLocaleString("ko-KR", {
                minimumFractionDigits: config.decimals,
                maximumFractionDigits: config.decimals
            });
        }

        function intervalLabels(themeKey) {
            const config = THEMES[themeKey];
            const breaks = metadata.indicators[themeKey].breaks;
            if (themeKey === "greenspace") {
                return [
                    `0${config.suffix}`,
                    `0 초과 – ${formatValue(breaks[0], config)}${config.suffix}`,
                    `${formatValue(breaks[0], config)} 초과 – ${formatValue(breaks[1], config)}${config.suffix}`,
                    `${formatValue(breaks[1], config)} 초과 – ${formatValue(breaks[2], config)}${config.suffix}`,
                    `${formatValue(breaks[2], config)}${config.suffix} 초과`
                ];
            }
            return [
                `${formatValue(breaks[0], config)}${config.suffix} 이하`,
                `${formatValue(breaks[0], config)} 초과 – ${formatValue(breaks[1], config)}${config.suffix}`,
                `${formatValue(breaks[1], config)} 초과 – ${formatValue(breaks[2], config)}${config.suffix}`,
                `${formatValue(breaks[2], config)} 초과 – ${formatValue(breaks[3], config)}${config.suffix}`,
                `${formatValue(breaks[3], config)}${config.suffix} 초과`
            ];
        }

        function renderLegend(themeKey) {
            const config = THEMES[themeKey];
            const labels = intervalLabels(themeKey);
            legendHeading.textContent = config.heading;
            legendNote.textContent = `${config.note} · 회색은 결측`;
            legendItems.replaceChildren();
            labels.forEach((label, index) => {
                const item = document.createElement("div");
                const swatch = document.createElement("span");
                const text = document.createElement("span");
                item.className = "legend-item";
                swatch.className = "legend-swatch";
                swatch.style.backgroundColor = config.colors[index];
                text.textContent = label;
                item.append(swatch, text);
                legendItems.append(item);
            });
            legend.hidden = false;
        }

        function applyTheme(themeKey) {
            const config = THEMES[themeKey];
            map.data.setStyle((feature) => {
                const level = feature.getProperty(config.levelProperty);
                return {
                    fillColor: level ? config.colors[level - 1] : MISSING_COLOR,
                    fillOpacity: 0.66,
                    strokeColor: "#ffffff",
                    strokeOpacity: 0.75,
                    strokeWeight: 0.45,
                    clickable: false
                };
            });
            map.data.setMap(map);
            renderLegend(themeKey);
        }

        function selectTheme(themeKey) {
            checkboxes.forEach((checkbox) => {
                checkbox.checked = checkbox.dataset.theme === themeKey;
            });
            activeTheme = themeKey;
            applyTheme(themeKey);
        }

        checkboxes.forEach((checkbox) => {
            checkbox.addEventListener("change", () => {
                if (checkbox.checked) {
                    selectTheme(checkbox.dataset.theme);
                } else if (activeTheme === checkbox.dataset.theme) {
                    activeTheme = null;
                    map.data.setMap(null);
                    legend.hidden = true;
                }
            });
        });

        async function loadThemes() {
            const response = await fetch("/data/london-lsoa-themes.json");
            if (!response.ok) throw new Error(`Theme data HTTP ${response.status}`);
            return response.json();
        }

        try {
            const geojson = await loadThemes();
            metadata = geojson.metadata;
            map.data.addGeoJson(geojson);
            checkboxes.forEach((checkbox) => checkbox.disabled = false);
            selectTheme("safety");
            status.hidden = true;
        } catch (error) {
            activeTheme = null;
            status.hidden = false;
            status.textContent = "주제도 데이터를 불러오지 못했습니다. 새로고침해 주세요. 내 레이어 그리기는 계속 사용할 수 있습니다.";
            console.error(error);
        }

        function suspendRendering() {
            if (!activeTheme) return;
            clearTimeout(resumeTimer);
            map.data.setMap(null);
        }
        function resumeRendering() {
            clearTimeout(resumeTimer);
            resumeTimer = setTimeout(() => {
                if (activeTheme) map.data.setMap(map);
            }, 100);
        }
        map.addListener("zoom_changed", suspendRendering);
        map.addListener("dragstart", suspendRendering);
        map.addListener("idle", resumeRendering);
    }

    window.gm_authFailure = () => {
        const status = document.getElementById("status");
        status.hidden = false;
        status.textContent = "Google Maps API 키를 확인해 주세요.";
    };
</script>
<script th:src="|https://maps.googleapis.com/maps/api/js?key=${mapsKey}&callback=initMap|" async defer></script>
</body>
</html>
